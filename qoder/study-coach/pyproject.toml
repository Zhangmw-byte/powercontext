[project]
name = "study-coach"
version = "0.1.0"
description = "Qoder × OceanBase 2026 复习记忆助手 — PowerContext 持久化后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "powercontext[builtin]==1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
